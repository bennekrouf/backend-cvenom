# cvenom endpoints for the api0 "cvenom" tenant — replaces cvenom-mcp.
#
#   Upload in the api0 dashboard (API section), signed in as the tenant owner.
#
# Each endpoint becomes an MCP tool named slug("<group> <text>"), e.g.
# "cvenom" + "list profiles" → `cvenom-list-profiles`.
#
# ── Paths ─────────────────────────────────────────────────────────────────────
# The backend mounts every route at the root (no /api prefix since fd457c8,
# Nov 2025).
#
# ── How api0 sends a call ─────────────────────────────────────────────────────
# • POST/PUT: the tool arguments are the JSON body, verbatim. Every handler takes
#   StandardRequest<T>, which flattens T, so a flat body is exactly right.
# • GET: {placeholders} fill the path; every other argument becomes a query
#   parameter (?lang=…, ?path=…).
# • Every parameter is a JSON Schema "string"; `alternatives` becomes an `enum`
#   — the only values allowed — so it is used for fixed choices, never synonyms.
#
# ── Identity ──────────────────────────────────────────────────────────────────
# forward_identity stays on (the default): cvenom acts as the person in
# X-User-Email, and api0's identity token proves the call came from api0.
#
# ── Deliberately not exposed ──────────────────────────────────────────────────
# Payments (intent/confirm), DELETE /me (account deletion), admin and BD routes,
# brands, preferences, feedback, multipart uploads (picture, CV file — MCP cannot
# send a file), raw file save and structured cv-data writes, health, /outputs.
# Profile writes are exposed only through save-optimized, which snapshots the
# previous files first (restore profile version undoes it).

api_groups:

  - name: "cvenom"
    description: "Your cvenom CV profiles: read them, generate PDFs, translate, tailor to a job, write cover letters"
    base: "https://api.cvenom.com"
    endpoints:

      # ── Account ────────────────────────────────────────────────────────────

      - text: "get my account"
        description: "The signed-in cvenom user: email and display name."
        verb: "GET"
        path: "/me"

      - text: "get credit balance"
        description: "My cvenom credit balance. Generating, optimizing and translating cost credits."
        verb: "GET"
        path: "/payment/balance"

      - text: "list credit transactions"
        description: "My credit history: purchases and what each generation cost."
        verb: "GET"
        path: "/payment/transactions"

      - text: "list ai regions"
        description: >-
          The AI regions (Europe, China, United States) cvenom can run its AI in —
          importing, tailoring, translating, cover letters — and the one I picked
          (current: null means cvenom's default). Same regions as GitAgent. Each
          region charges its own price: prices gives the credits per AI action
          there, default_prices those on the default.
        verb: "GET"
        path: "/ai/regions"

      - text: "set ai region"
        description: >-
          Choose where my cvenom AI runs from now on, for every AI tool. Pick a
          region on offer from list ai regions, or "default" for cvenom's own
          choice. It changes what each AI action costs: tell me the new prices
          from list ai regions before switching.
        verb: "PUT"
        path: "/ai/region"
        parameters:
          - name: "region"
            description: "The region id, or default"
            required: "true"
            alternatives: ["europe", "china", "usa", "default"]

      # ── Profiles ───────────────────────────────────────────────────────────

      - text: "list profiles"
        description: >-
          My CV profiles and their files, as a tree. Each top-level folder is a
          profile (e.g. john-doe); its files show which languages exist, and
          archived: true marks an archived profile. Start here to find the profile
          name every other tool needs.
        verb: "GET"
        path: "/files/tree"

      - text: "get cv"
        description: "The full content of one profile's CV in one language: personal info, experiences, education, skills."
        verb: "GET"
        path: "/profiles/{profile}/cv-data"
        parameters:
          - name: "profile"
            description: "Profile name, from list profiles (e.g. john-doe)"
            required: "true"
          - name: "lang"
            description: "CV language. Omit for English."
            required: "false"
            alternatives: ["en", "fr", "de"]

      - text: "read profile file"
        description: "The raw content of one file in a profile, by its path from list profiles."
        verb: "GET"
        path: "/files/content"
        parameters:
          - name: "path"
            description: "File path as shown by list profiles, e.g. john-doe/cv_params.toml"
            required: "true"

      - text: "list templates"
        description: "Available CV templates, with their ids for generate cv."
        verb: "GET"
        path: "/templates"

      - text: "create profile"
        description: "Create a new, empty CV profile."
        verb: "POST"
        path: "/create"
        parameters:
          - name: "profile"
            description: "New profile name, lowercase with dashes (e.g. john-doe)"
            required: "true"

      - text: "import cv from text"
        description: >-
          Create a profile from a CV pasted as plain text — all sections: name,
          experience, skills, education. AI structures it into a cvenom profile.
        verb: "POST"
        path: "/cv/import-text"
        parameters:
          - name: "cv_text"
            description: "The whole CV as plain text"
            required: "true"
          - name: "profile_name"
            description: "Profile name to create (e.g. john-doe). Derived from the CV when omitted."
            required: "false"

      - text: "duplicate profile"
        description: >-
          Copy a profile (CV files, picture, logos) to a new profile name. Use it
          to make a per-job copy before tailoring. Fails if the new name exists.
        verb: "POST"
        path: "/profiles/duplicate"
        parameters:
          - name: "profile"
            description: "Profile to copy (e.g. john-doe)"
            required: "true"
          - name: "new_profile"
            description: "Name of the copy (e.g. john-doe-proton)"
            required: "true"

      - text: "save cv as profile"
        description: >-
          Write a CV into a profile's files (cv_params.toml and experiences_<lang>.typ),
          e.g. the optimized_cv_json returned by optimize cv for job. Creates the
          profile, or replaces an existing one's CV; the previous files stay
          restorable with restore profile version.
        verb: "POST"
        path: "/save-optimized"
        parameters:
          - name: "profile_name"
            description: "Profile to write (e.g. john-doe-proton)"
            required: "true"
          - name: "cv_json"
            description: "The CV as a JSON string, in the optimized_cv_json format"
            required: "true"
          - name: "lang"
            description: "CV language. Omit for English."
            required: "false"
            alternatives: ["en", "fr", "de"]

      - text: "list profile versions"
        description: >-
          Saved earlier versions of a profile's CV files, newest first. A version
          is kept every time a tool or the editor overwrites the profile.
        verb: "GET"
        path: "/profiles/{profile}/versions"
        parameters:
          - name: "profile"
            description: "Profile name (e.g. john-doe)"
            required: "true"

      - text: "restore profile version"
        description: >-
          Put back an earlier version of a profile's CV files. The current files
          are saved as a version first, so this can be undone.
        verb: "POST"
        path: "/profiles/restore"
        parameters:
          - name: "profile"
            description: "Profile name (e.g. john-doe)"
            required: "true"
          - name: "version"
            description: "Version id from list profile versions. Omit for the newest."
            required: "false"

      - text: "archive profile"
        description: >-
          Archive a profile to tidy the dashboard: it moves to the Archived section
          and keeps all its files. Archived profiles still work with every tool.
          Pass archived "false" to unarchive. Prefer this over delete profile.
        verb: "POST"
        path: "/profiles/archive"
        parameters:
          - name: "profile"
            description: "Profile name (e.g. john-doe-proton)"
            required: "true"
          - name: "archived"
            description: "\"true\" to archive (the default), \"false\" to unarchive"
            required: "false"
            alternatives: ["true", "false"]

      - text: "delete profile"
        description: "Permanently delete a CV profile and all its files. Confirm with the user first."
        verb: "POST"
        path: "/delete-profile"
        parameters:
          - name: "profile"
            description: "Profile name to delete"
            required: "true"

      # ── Documents ──────────────────────────────────────────────────────────

      - text: "generate cv"
        description: >-
          Generate a PDF CV for a profile. Returns a download_url — always give the
          user the full URL, unchanged.
        verb: "POST"
        path: "/generate"
        parameters:
          - name: "profile"
            description: "Profile name (e.g. john-doe)"
            required: "true"
          - name: "lang"
            description: "CV language. Omit for English."
            required: "false"
            alternatives: ["en", "fr", "de"]
          - name: "template"
            description: "Template id from list templates. Omit for the default."
            required: "false"

      - text: "generate portfolio"
        description: "Generate a project portfolio PDF from a profile. Returns a download_url to give the user unchanged."
        verb: "POST"
        path: "/portfolio/generate"
        parameters:
          - name: "profile"
            description: "Profile name (e.g. john-doe)"
            required: "true"
          - name: "lang"
            description: "Language. Omit for English."
            required: "false"
            alternatives: ["en", "fr", "de"]
          - name: "template"
            description: "Template id. Omit for the default."
            required: "false"

      - text: "translate profile"
        description: "Translate a profile's CV into another language, creating that language version."
        verb: "POST"
        path: "/translate"
        parameters:
          - name: "profile_name"
            description: "Profile name (e.g. john-doe)"
            required: "true"
          - name: "target_lang"
            description: "Language to translate into"
            required: "true"
            alternatives: ["en", "fr", "de"]

      - text: "write cover letter"
        description: "Write a cover letter from a profile for a given job posting."
        verb: "POST"
        path: "/cover-letter"
        parameters:
          - name: "profile"
            description: "Profile name (e.g. john-doe)"
            required: "true"
          - name: "job_description"
            description: "The full job posting text"
            required: "true"
          - name: "lang"
            description: "Letter language"
            required: "true"
            alternatives: ["en", "fr", "de"]

      # ── Job fit ────────────────────────────────────────────────────────────

      - text: "analyze job fit"
        description: "How well a profile fits a job posting, with strengths and gaps."
        verb: "POST"
        path: "/analyze-job-fit"
        parameters:
          - name: "job_url"
            description: "URL of the job posting (e.g. a LinkedIn job)"
            required: "true"
          - name: "profile_name"
            description: "Profile name (e.g. john-doe)"
            required: "true"

      - text: "optimize cv for job"
        description: >-
          Tailor a profile's CV to a job posting and return the optimized CV. Does
          not change or save any profile (saved is always false): pass
          optimized_cv_json to save cv as profile to keep it, or use "optimize and
          generate" for a saved copy plus a PDF. Check warnings for problems in
          the source profile.
        verb: "POST"
        path: "/optimize"
        parameters:
          - name: "profile"
            description: "Profile name (e.g. john-doe)"
            required: "true"
          - name: "job_url"
            description: "URL of the job posting"
            required: "true"
          - name: "job_description"
            description: "The posting's text, when the URL cannot be read"
            required: "false"
          - name: "lang"
            description: "CV language. Omit for English."
            required: "false"
            alternatives: ["en", "fr", "de"]

      - text: "optimize and generate"
        description: >-
          Tailor a profile's CV to a job posting, save it as a NEW profile and
          generate its PDF. The base profile is not modified. Returns the new
          profile name and a download_url to give the user unchanged.
        verb: "POST"
        path: "/optimize-and-generate"
        parameters:
          - name: "profile"
            description: "Profile name (e.g. john-doe)"
            required: "true"
          - name: "job_url"
            description: "URL of the job posting"
            required: "true"
          - name: "job_description"
            description: "The posting's text, when the URL cannot be read"
            required: "false"
          - name: "lang"
            description: "CV language. Omit for English."
            required: "false"
            alternatives: ["en", "fr", "de"]
          - name: "template"
            description: "Template id from list templates. Omit for the default."
            required: "false"
          - name: "save_as"
            description: "Name for the new tailored profile. Omit for <profile>-<company>-<job-title>."
            required: "false"
